    quote: "I think a lot of us learn as we get older that happiness is internal. Happiness is a choice that you make and a skill that you develop."
    note: "Earliest dated statement of the happiness-as-choice/skill principle — 6 years before the 2021 canonical essay form. Start of the arc that MW-922 (2025) later downgrades."

